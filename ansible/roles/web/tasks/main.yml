---
- name: Install web packages
  apt:
    name:
      - nginx
      - python3
      - python3-flask
      - python3-venv
    state: present
    update_cache: yes

- name: Create application directory
  file:
    path: /opt/lab-app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Flask application
  template:
    src: app.py.j2
    dest: /opt/lab-app/app.py
    owner: root
    group: root
    mode: "0644"

- name: Install application systemd service
  template:
    src: lab-app.service.j2
    dest: /etc/systemd/system/lab-app.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start application
  systemd:
    name: lab-app
    enabled: yes
    state: started
    daemon_reload: yes