---
- name: Install web packages
  ansible.builtin.apt:
    name:
      - nginx
      - python3
      - python3-flask
      - python3-venv
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: /opt/lab-app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Flask application
  ansible.builtin.template:
    src: app.py.j2
    dest: /opt/lab-app/app.py
    owner: root
    group: root
    mode: "0644"

- name: Install application systemd service
  ansible.builtin.template:
    src: lab-app.service.j2
    dest: /etc/systemd/system/lab-app.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start application
  ansible.builtin.systemd:
    name: lab-app
    enabled: true
    state: started
    daemon_reload: true

- name: Configure nginx site
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/lab-app
    owner: root
    group: root
    mode: "0644"

- name: Enable lab nginx configuration
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lab-app
    dest: /etc/nginx/sites-enabled/lab-app
    state: link

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: restarted
