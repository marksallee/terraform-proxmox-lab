---
- hosts: all
  become: true

  vars:
    ssh_public_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

  tasks:

    - name: Install SSH public key for root
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ ssh_public_key }}"
    
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install SSH server
      apt:
        name: openssh-server
        state: present

    - name: Ensure SSH is running
      service:
        name: ssh
        enabled: yes
        state: started
    
    - name: Create ansible user
      user:
        name: ansible
        groups: sudo
        append: yes
        shell: /bin/bash

    - name: Install authorized key
      authorized_key:
        user: ansible
        key: "{{ ssh_public_key }}"