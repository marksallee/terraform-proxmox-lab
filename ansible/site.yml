---
# First connection to a freshly provisioned container: no "ansible" service
# account exists yet, so we must connect as root using the general key
# Terraform injected via ssh_public_key. The bootstrap role creates the
# dedicated ansible user (with its own key) that every later play uses.
- name: Bootstrap the ansible automation user and apply common baseline
  hosts: all
  become: true
  remote_user: root
  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  roles:
    - bootstrap
    - common

- name: Configure web servers
  hosts: web
  become: true
  roles:
    - web

- name: Configure database servers
  hosts: database
  become: true
  roles:
    - postgres
