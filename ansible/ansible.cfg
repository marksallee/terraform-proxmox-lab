[defaults]
inventory = inventory.ini
host_key_checking = False
remote_user = ansible
private_key_file = ~/.ssh/id_ed25519_lab

[ssh_connection]
pipelining = True
# Lab containers get destroyed/recreated often (each rebuild gets a new SSH
# host key at the same IP), so we don't persist host keys for them at all -
# never write/read ~/.ssh/known_hosts, never prompt or fail on a changed key.
# Not something you'd want for anything but a disposable lab.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no